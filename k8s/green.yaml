apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api-green
  labels: {app: demo-api, release: green}
spec:
  replicas: 2
  selector: {matchLabels: {app: demo-api, release: green}}
  template:
    metadata: {labels: {app: demo-api, release: green}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 2}
          volumeMounts:
            - {name: content, mountPath: /usr/share/nginx/html, readOnly: true}
      volumes:
        - name: content
          configMap: {name: demo-green-content}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-green-content
data:
  index.html: 'green'
